services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yasas
      POSTGRES_USER: yasas
      POSTGRES_PASSWORD: yasas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yasas -d yasas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - yasas_postgres_data:/var/lib/postgresql/data

volumes:
  yasas_postgres_data:
