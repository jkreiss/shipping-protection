name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insurance_test?schema=public
      CHECKOUT_TOKEN_HASH_SECRET: ci-checkout-token-hash-secret
      VERIFY_ISOLATED_DB: "1"
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:e2e:list
      - run: npm run verify:postgres
      - run: npm run verify:webhook-postgres
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: docker build --tag insurance-ci .
