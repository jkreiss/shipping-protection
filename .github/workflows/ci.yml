name: CI

# Branch pushes are covered by their pull request; running on both doubled every PR's checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insurance_test?schema=public
      VERIFY_ISOLATED_DB: "1"
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run verify:schema
      - run: npm test
      - run: npm run test:e2e:list
      - run: npm run verify:postgres
      - run: npm run verify:webhook-postgres
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Runs alongside checks. Layers are cached between runs, so only a
  # dependency change reinstalls packages inside the image.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: insurance-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/verify-container.sh insurance-ci

  # Keep the required check name stable and fail closed for either dependency.
  verify:
    needs: [checks, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success && test "${{ needs.docker.result }}" = success
