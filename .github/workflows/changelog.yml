name: Generate Draft Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Read current main even when an older run was queued.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create or Update Draft Release
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const marker = '<!-- changelog-main: generated by changelog.yml -->';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...repo,
              per_page: 100,
            });
            const draft = releases.find(release =>
              release.draft && release.body?.includes(marker)
            );
            const latest = releases
              .filter(release => !release.draft && !release.prerelease)
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))[0];
            const git = async args => (await exec.getExecOutput('git', args, {
              silent: true,
            })).stdout.trim();
            const sha = await git(['rev-parse', 'HEAD']);
            let base;
            if (latest) {
              base = await git(['rev-parse', '--verify', `refs/tags/${latest.tag_name}^{commit}`]);
              const ancestry = await exec.getExecOutput('git', [
                'merge-base', '--is-ancestor', base, sha,
              ], { silent: true, ignoreReturnCode: true });
              if (ancestry.exitCode !== 0) {
                throw new Error(`Published release ${latest.tag_name} is not an ancestor of main.`);
              }
            }

            // Include direct commits and merged branch commits, including the
            // initial commit when there is no published release yet.
            const args = ['log', '--no-merges', '--reverse', '--format=%H%x09%s', sha];
            if (base) args.push(`^${base}`);
            const log = await git(args);
            if (!log) {
              core.info('No unreleased commits; no draft changes needed.');
              return;
            }
            const url = `${context.serverUrl}/${repo.owner}/${repo.repo}`;
            const changes = log.split('\n').map(line => {
              const separator = line.indexOf('\t');
              const hash = line.slice(0, separator);
              const title = line.slice(separator + 1);
              return `- ${title} ([${hash.slice(0, 7)}](${url}/commit/${hash}))`;
            });
            const comparison = base
              ? `\n\n[Full diff](${url}/compare/${base}...${sha})`
              : '';
            const body = `${marker}\n\n## Changes\n\n${changes.join('\n')}${comparison}`;
            if (body.length > 125000) {
              throw new Error('Changelog exceeds GitHub release notes limit; choose a newer release baseline.');
            }
            const release = {
              ...repo,
              tag_name: draft?.tag_name ?? `changelog-draft-${context.runId}`,
              target_commitish: sha,
              name: draft?.name ?? 'Next release',
              body,
              draft: true,
              prerelease: false,
            };
            if (draft) {
              const current = await github.rest.repos.getRelease({ ...repo, release_id: draft.id });
              if (!current.data.draft) {
                throw new Error('The draft was published during this run; rerun to use the new baseline.');
              }
            }
            const result = draft
              ? await github.rest.repos.updateRelease({ ...release, release_id: draft.id })
              : await github.rest.repos.createRelease(release);
            await core.summary
              .addLink('Review draft changelog', result.data.html_url)
              .addRaw(`\n\nIncludes ${changes.length} commits through ${sha}.`)
              .write();
