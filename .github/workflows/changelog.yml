name: Generate Draft Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Read current main even when an older run was queued.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create or Update Draft Release
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { generateDraftChangelog } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/changelog.js`).href);
            await generateDraftChangelog({ github, context, exec, core });
